<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102e46"><title>Revista RIS Ate | Campaña Mercado Josfel</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#082238;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}body{overflow-x:hidden}.viewer{width:100%;min-height:100dvh;display:flex;align-items:center;justify-content:center;position:relative;padding:0;background:#082238}.page-wrap{width:min(100vw,720px);position:relative;perspective:1800px;overflow:hidden;background:#fff;isolation:isolate}.page-wrap::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 15px #0001;z-index:5}.turn-sheet{position:absolute;inset:0;z-index:8;transform-style:preserve-3d;transform-origin:left center;pointer-events:none;animation:flipForward 1.05s cubic-bezier(.38,.02,.2,1) forwards}.turn-sheet.backward{transform-origin:right center;animation-name:flipBackward}.turn-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff}.turn-face img{width:100%;height:100%;object-fit:fill;display:block}.turn-face.front{box-shadow:8px 0 20px #0005}.turn-face.back{transform:rotateY(180deg);background:linear-gradient(90deg,#d8e1e5,#fff 18%,#f3f5f6);box-shadow:-8px 0 22px #0004}.turn-face.back img{transform:scaleX(-1);opacity:.16;filter:grayscale(.2)}@keyframes flipForward{0%{transform:rotateY(0deg)}45%{transform:rotateY(-95deg)}100%{transform:rotateY(-180deg)}}@keyframes flipBackward{0%{transform:rotateY(0deg)}45%{transform:rotateY(95deg)}100%{transform:rotateY(180deg)}}.page{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none;transform-origin:left center;transition:transform .36s ease,opacity .36s ease}.page.turn-next{transform:rotateY(-23deg) translateX(-7%);opacity:.55}.page.turn-prev{transform:rotateY(23deg) translateX(7%);opacity:.55}.controls{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(24,52,69,.91);border:1px solid #ffffff65;box-shadow:0 8px 24px #0018279c;border-radius:999px;padding:9px 12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);white-space:nowrap}.control{height:44px;min-width:44px;border:0;border-radius:50%;display:grid;place-items:center;background:#087f9a;color:white;font-size:25px;font-weight:700;text-decoration:none;cursor:pointer}.control:disabled{opacity:.38}.count{font-size:16px;min-width:48px;text-align:center;font-weight:500}.pdf{font-size:17px;font-weight:650}.tip{position:fixed;z-index:19;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 72px);left:50%;transform:translateX(-50%);border-radius:99px;padding:8px 14px;background:#1b3549c9;font-size:12px;white-space:nowrap;pointer-events:none;opacity:1;transition:opacity .4s}.tip.hidden{opacity:0}.control svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}@media(min-width:800px){.viewer{padding:22px 0}.page-wrap{box-shadow:0 12px 45px #0008}.controls{bottom:24px}}@media(max-width:360px){.controls{gap:6px;padding:7px 9px}.control{height:39px;min-width:39px;font-size:22px}.count{min-width:43px;font-size:14px}}@media(prefers-reduced-motion:reduce){.page{transition:none}.turn-sheet{animation-duration:.01ms}}
</style></head><body><main class="viewer" id="viewer"><div class="page-wrap" id="stage"><img class="page" id="page" src="pagina-1.jpg" alt="Página 1 de 4 de la revista de RIS Ate" draggable="false"></div></main><div class="tip" id="tip">Desliza para pasar las hojas ↔</div><nav class="controls" aria-label="Controles de revista"><button class="control" id="prev" aria-label="Página anterior">‹</button><span class="count" id="counter">1 / 4</span><button class="control" id="next" aria-label="Página siguiente">›</button><button class="control" id="full" aria-label="Pantalla completa" title="Pantalla completa"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button><a class="control pdf" href="revista-josfel.pdf" target="_blank" rel="noopener" aria-label="Ver PDF">PDF</a></nav><script>
const total=4;let current=1,busy=false,startX=null;const page=document.getElementById('page'),counter=document.getElementById('counter'),tip=document.getElementById('tip');for(let n=1;n<=total;n++){const preload=new Image();preload.src='pagina-'+n+'.jpg'}function sync(){page.src='pagina-'+current+'.jpg';page.alt='Página '+current+' de '+total+' de la revista RIS Ate';counter.textContent=current+' / '+total;document.getElementById('prev').disabled=current===1;document.getElementById('next').disabled=current===total}function go(n){if(busy||n<1||n>total||n===current)return;busy=true;const oldSrc=page.src;const stage=document.getElementById('stage');const sheet=document.createElement('div');sheet.className='turn-sheet'+(n<current?' backward':'');sheet.innerHTML='<div class="turn-face front"><img alt="" src="'+oldSrc+'"></div><div class="turn-face back"><img alt="" src="'+oldSrc+'"></div>';stage.appendChild(sheet);current=n;sync();tip.classList.add('hidden');sheet.addEventListener('animationend',()=>{sheet.remove();busy=false},{once:true});setTimeout(()=>{if(sheet.isConnected){sheet.remove();busy=false}},1250)}document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});const stage=document.getElementById('stage');stage.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});stage.addEventListener('touchend',e=>{if(startX===null)return;const dx=e.changedTouches[0].screenX-startX;if(Math.abs(dx)>40)go(current+(dx<0?1:-1));startX=null},{passive:true});document.getElementById('full').onclick=()=>{if(document.fullscreenElement){document.exitFullscreen?.()}else{document.documentElement.requestFullscreen?.()}};sync();
</script></body></html>
