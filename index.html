<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102f48"><title>Revista RIS Ate | Campaña de Salud Mercado Josfel</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#24546c 0%,#102d45 46%,#071723 100%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:white;min-height:100dvh;display:flex;flex-direction:column;align-items:center}header{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px clamp(12px,4vw,38px);background:#081b2ac9}header strong{font-size:clamp(12px,2.2vw,17px)}header small{display:block;color:#b9d6e2;font-size:12px;margin-top:2px}a.pdf{background:#fff;color:#11354d;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:750;white-space:nowrap;font-size:13px}.reader{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:14px 8px 8px;gap:clamp(5px,2vw,18px)}.stage{position:relative;height:min(78dvh,calc((100vw - 112px)*16/9));width:auto;max-width:calc(100vw - 105px);aspect-ratio: 9 / 16;perspective:1600px;filter:drop-shadow(0 16px 20px #0008);touch-action:pan-y;overflow:hidden;border-radius:5px;background:transparent}.sheet{position:absolute;inset:0;backface-visibility:hidden;transform-origin:left center;transition:transform .56s cubic-bezier(.2,.7,.2,1),opacity .56s;will-change:transform}.sheet img{width:100%;height:100%;object-fit:fill;display:block;background:transparent}.sheet.turn-next{transform:rotateY(-85deg);opacity:.25}.sheet.turn-prev{transform:rotateY(75deg);opacity:.25}button.arrow{border:1px solid #ffffff50;border-radius:50%;background:#ffffff1a;color:#fff;font-size:25px;width:44px;height:44px;cursor:pointer;flex-shrink:0}button.arrow:disabled{opacity:.23;cursor:default}footer{padding:10px 10px 17px;display:flex;align-items:center;justify-content:center;gap:14px;color:#dceaf1;font-size:13px}.dots{display:flex;gap:8px}.dot{height:8px;width:8px;border-radius:20px;background:#9db5c1;cursor:pointer;border:0;padding:0}.dot.active{width:24px;background:#f2c85c}.hint{font-size:12px;color:#b4c9d5;text-align:center;margin:0 12px 7px}@media(max-width:550px){header{padding:10px 12px}header strong{font-size:12px}header small{font-size:10px}.reader{padding:8px 3px}.stage{max-width:calc(100vw - 90px);height:min(73dvh,calc((100vw - 90px)*16/9))}button.arrow{width:36px;height:36px;font-size:21px}a.pdf{font-size:12px;padding:9px}}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
 .pdf-bottom{display:flex;justify-content:center;padding:0 12px 20px}.pdf-bottom a.pdf{min-width:160px;text-align:center;box-shadow:0 5px 20px #0005} </style></head><body><header><div><strong>RIS ATE · CAMPAÑA DE SALUD INTEGRAL</strong><small>Mercado Josfel · 23 de octubre de 2026</small></div></header><main class="reader"><button class="arrow" id="prev" aria-label="Página anterior">‹</button><div class="stage" id="stage" aria-label="Revista digital de cuatro páginas"><div class="sheet" id="sheet"><img id="page" src="pagina-1.jpg" alt="Página 1 de 4 de la revista RIS Ate" draggable="false"></div></div><button class="arrow" id="next" aria-label="Página siguiente">›</button></main><p class="hint">Desliza sobre la revista o usa las flechas para cambiar de página</p><footer><span id="counter">1 / 4</span><div class="dots" id="dots"></div></footer><div class="pdf-bottom"><a class="pdf" href="revista-josfel.pdf" target="_blank" rel="noopener">Ver PDF ↗</a></div><script>
const total=4;let current=1,busy=false,startX=null;const sheet=document.getElementById('sheet'),img=document.getElementById('page'),counter=document.getElementById('counter'),dots=document.getElementById('dots');for(let n=1;n<=total;n++){let b=document.createElement('button');b.className='dot';b.title='Ir a la página '+n;b.setAttribute('aria-label','Ir a la página '+n);b.onclick=()=>go(n);dots.appendChild(b)}function sync(){img.src='pagina-'+current+'.jpg';img.alt='Página '+current+' de '+total+' de la revista RIS Ate';counter.textContent=current+' / '+total;document.getElementById('prev').disabled=current===1;document.getElementById('next').disabled=current===total;[...dots.children].forEach((b,i)=>b.classList.toggle('active',i===current-1))}function go(n){if(busy||n<1||n>total||n===current)return;busy=true;let direction=n>current?'turn-next':'turn-prev';sheet.classList.add(direction);setTimeout(()=>{current=n;sync();sheet.style.transition='none';sheet.classList.remove(direction);sheet.style.transform='rotateY(0)';sheet.style.opacity='1';void sheet.offsetWidth;sheet.style.transition='';setTimeout(()=>{sheet.style.transform='';sheet.style.opacity='';busy=false},30)},370)}document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});const stage=document.getElementById('stage');stage.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});stage.addEventListener('touchend',e=>{if(startX===null)return;let dx=e.changedTouches[0].screenX-startX;if(Math.abs(dx)>45)go(current+(dx<0?1:-1));startX=null},{passive:true});sync();
</script></body></html>
